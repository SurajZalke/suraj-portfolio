[build]
functions = "netlify/functions"
publish = "."

[functions]
node_bundler = "esbuild"

[context.production]
environment = { NODE_ENV = "production" }

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "max-age=0, must-revalidate"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
